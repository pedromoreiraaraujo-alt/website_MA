  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

29, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root {\n    /* Core palette */\n    --ivory:    #f5efe2;   /* primary background — soft cream */\n    --bone:     #ebe2ce;   /* secondary cream — paper */\n    --sand:     #d8c9a8;   /* tertiary warm neutral */\n    --champagne:#e0c684;   /* gold — primary accent (light) */\n    --gold-deep:#b89a55;   /* deeper gold — secondary accent */\n    --cacau:    #553a22;   /* warm brown — supporting */\n    --espresso: #14120f;   /* near-black — primary dark */\n    --ink:      #0c0b09;   /* pure black — type */\n    --cocoa:    #2a2724;   /* charcoal — mid neutral */\n    --walnut:   #4a4640;   /* graphite — tertiary */\n  }\n  * { box-sizing: border-box; }\n  html, body { margin: 0; }\n  body {\n    font-family: 'Jost', system-ui, sans-serif;\n    color: var(--ink);\n    background: var(--ivory);\n    -webkit-font-smoothing: antialiased;\n  }\n\n  /* ---------- Layout ---------- */\n  .page {\n    max-width: 1320px;\n    margin: 0 auto;\n    padding: 80px 64px 120px;\n  }\n\n  /* ---------- Typography ---------- */\n  .eyebrow {\n    font-family: 'Jost', sans-serif;\n    font-weight: 300;\n    font-size: 11px;\n    letter-spacing: .55em;\n    text-transform: uppercase;\n    color: var(--cocoa);\n    text-indent: .55em;\n  }\n  h1, h2, h3 { margin: 0; font-weight: 400; }\n  .display {\n    font-family: 'Cormorant Garamond', serif;\n    font-weight: 400;\n    font-size: 72px;\n    line-height: 1.02;\n    letter-spacing: -.01em;\n  }\n  .display em {\n    font-family: 'Italianno', cursive;\n    font-style: normal; font-weight: 400;\n    color: var(--gold-deep);\n    font-size: 1.45em;\n    line-height: 0;\n    vertical-align: -.05em;\n    padding: 0 .05em;\n  }\n\n  .section-title {\n    font-family: 'Marcellus', serif;\n    font-size: 32px;\n    letter-spacing: .04em;\n    color: var(--ink);\n  }\n  .lede {\n    font-family: 'Cormorant Garamond', serif;\n    font-style: italic;\n    font-size: 22px;\n    line-height: 1.5;\n    color: var(--cocoa);\n    max-width: 64ch;\n  }\n  .body {\n    font-family: 'Jost', sans-serif;\n    font-weight: 300;\n    font-size: 14px;\n    line-height: 1.7;\n    color: var(--cocoa);\n  }\n\n  hr.rule {\n    border: 0; height: 1px; background: var(--cocoa); opacity: .25;\n    margin: 56px 0;\n  }\n\n  /* ---------- Header ---------- */\n  header.cover {\n    display: grid;\n    grid-template-columns: 1.1fr .9fr;\n    gap: 48px;\n    align-items: stretch;\n    min-height: 540px;\n  }\n  .cover-left {\n    background: var(--bone);\n    border: 1px solid rgba(42,31,21,.08);\n    padding: 48px;\n    display: flex; flex-direction: column; justify-content: space-between;\n  }\n  .cover-right {\n    background: var(--espresso);\n    color: var(--ivory);\n    display: flex; align-items: center; justify-content: center;\n    position: relative; overflow: hidden;\n  }\n  .cover-right::after {\n    content:\"\"; position:absolute; inset:24px;\n    border: 1px solid rgba(202,161,90,.35);\n    pointer-events:none;\n  }\n  .cover-right .logo-wrap { width: 70%; max-width: 360px; }\n  .meta-row { display:flex; gap: 36px; }\n  .meta-row > div { flex: 1; }\n  .meta-label {\n    font-family: 'Jost', sans-serif; font-weight: 300; font-size: 10px;\n    letter-spacing: .45em; text-transform: uppercase; text-indent: .45em;\n    color: var(--cocoa); margin-bottom: 6px;\n  }\n  .meta-val {\n    font-family: 'Marcellus', serif; font-size: 16px; color: var(--ink);\n  }\n\n  /* ---------- Logo monochrome row ---------- */\n  .logo-grid {\n    display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px;\n  }\n  .logo-cell {\n    aspect-ratio: 1 / 1;\n    display: flex; align-items: center; justify-content: center;\n    padding: 16px; position: relative;\n    border: 1px solid rgba(42,31,21,.08);\n  }\n  .logo-cell .lbl {\n    position:absolute; top:10px; left:14px;\n    font-family:'Jost',sans-serif; font-weight:300; font-size:9px;\n    letter-spacing:.4em; text-transform:uppercase; text-indent:.4em;\n    opacity:.7;\n  }\n  .logo-cell .logo-wrap { width: 78%; }\n  .cell-ivory  { background: var(--ivory); color: var(--ink); }\n  .cell-bone   { background: var(--bone); color: var(--ink); }\n  .cell-gold   { background: var(--champagne); color: var(--espresso); }\n  .cell-ink    { background: var(--espresso); color: var(--ivory); }\n  .cell-cacau  { background: var(--cacau); color: var(--ivory); }\n\n  /* ---------- Palette ---------- */\n  .palette {\n    display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px;\n  }\n  .swatch {\n    aspect-ratio: 3 / 4;\n    border-radius: 0;\n    padding: 18px;\n    display: flex; flex-direction: column; justify-content: space-between;\n    border: 1px solid rgba(42,31,21,.08);\n  }\n  .swatch .name {\n    font-family: 'Marcellus', serif; font-size: 18px; letter-spacing: .04em;\n  }\n  .swatch .meta {\n    font-family: 'Jost', sans-serif; font-weight: 300; font-size: 10px;\n    letter-spacing: .25em; text-transform: uppercase; opacity: .8;\n    line-height: 1.7;\n  }\n  .swatch .meta b { font-weight: 500; letter-spacing: .15em; }\n\n  /* ---------- Typography specimen ---------- */\n  .type-grid {\n    display: grid; grid-template-columns: 1fr 1fr; gap: 28px;\n  }\n  .type-card {\n    background: var(--bone);\n    padding: 36px 40px;\n    border: 1px solid rgba(42,31,21,.08);\n    min-height: 320px;\n  }\n  .type-card .role {\n    font-family: 'Jost', sans-serif; font-weight: 300; font-size: 10px;\n    letter-spacing: .45em; text-transform: uppercase; text-indent: .45em;\n    color: var(--gold-deep); margin-bottom: 18px;\n  }\n  .type-card .face-name {\n    font-family: 'Marcellus', serif; font-size: 22px; margin-bottom: 4px; color: var(--ink);\n  }\n  .type-card .face-use {\n    font-family: 'Jost', sans-serif; font-weight: 300; font-size: 12px;\n    color: var(--cocoa); margin-bottom: 28px; letter-spacing: .04em;\n  }\n  .specimen-cormorant {\n    font-family: 'Cormorant Garamond', serif;\n    font-size: 80px; line-height: .95; color: var(--ink); letter-spacing: -.01em;\n  }\n  .specimen-cormorant em { font-style: italic; color: var(--gold-deep); }\n  .specimen-marcellus {\n    font-family: 'Marcellus', serif;\n    font-size: 38px; line-height: 1.05; letter-spacing: .04em; color: var(--ink);\n  }\n  .specimen-jost {\n    font-family: 'Jost', sans-serif; font-weight: 300;\n    font-size: 14px; line-height: 1.7; letter-spacing: .04em; color: var(--cocoa);\n    column-count: 2; column-gap: 24px;\n  }\n  .alphabet {\n    margin-top: 16px;\n    font-family: inherit;\n    font-size: 13px; letter-spacing: .25em; opacity: .55;\n    word-spacing: .4em;\n  }\n\n  /* ---------- Applications ---------- */\n  .apps {\n    display: grid; grid-template-columns: 1.2fr .8fr; gap: 24px;\n  }\n  .app {\n    border: 1px solid rgba(42,31,21,.08);\n    overflow: hidden;\n    position: relative;\n    aspect-ratio: 16 / 11;\n    display: flex; align-items: center; justify-content: center;\n  }\n  .card-mock {\n    background: var(--bone);\n    width: 100%; height: 100%;\n    display: flex; align-items: center; justify-content: center;\n    position: relative;\n  }\n  .card-mock::before {\n    content:\"\"; position:absolute; inset: 14% 16%;\n    background: var(--ivory);\n    box-shadow: 0 30px 50px -20px rgba(20,17,13,.35), 0 1px 0 rgba(255,255,255,.4) inset;\n  }\n  .card-content {\n    position: relative; z-index: 1; width: 64%; text-align: center;\n    display: flex; flex-direction: column; align-items: center; gap: 14px;\n  }\n  .card-content .ml-logo { width: 150px; }\n  .card-content .name {\n    font-family: 'Marcellus', serif; font-size: 18px; letter-spacing: .12em;\n    color: var(--espresso); text-transform: uppercase;\n  }\n  .card-content .role {\n    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 14px; color: var(--gold-deep);\n  }\n  .card-content .info {\n    font-family: 'Jost', sans-serif; font-weight: 300; font-size: 9px; letter-spacing: .25em;\n    color: var(--cocoa); margin-top: 8px; text-indent: .25em; white-space: nowrap;\n  }\n  .rule-gold { width: 36px; height: 1px; background: var(--champagne); }\n\n  .envelope {\n    background: var(--espresso); color: var(--ivory);\n    position: relative; padding: 36px;\n    width: 100%; height: 100%;\n  }\n  .envelope .corner {\n    position:absolute; top:24px; left:24px; width: 60px;\n  }\n  .envelope .stamp {\n    position:absolute; top: 36px; right: 36px;\n    width: 90px; height: 90px;\n    background: var(--champagne);\n    color: var(--espresso);\n    display:flex; align-items:center; justify-content:center;\n    border-radius: 50%;\n  }\n  .envelope .stamp svg { width: 60%; }\n  .envelope .addr {\n    position: absolute; bottom: 32px; left: 36px; right: 36px;\n    font-family: 'Cormorant Garamond', serif; font-style: italic;\n    font-size: 16px; line-height: 1.6;\n    border-top: 1px solid rgba(243,236,220,.25); padding-top: 18px;\n  }\n  .envelope .addr .name {\n    font-family: 'Marcellus', serif; font-style: normal;\n    font-size: 18px; letter-spacing: .06em; color: var(--champagne);\n    margin-bottom: 6px;\n  }\n\n  .signage {\n    background:\n      radial-gradient(120% 80% at 30% 30%, rgba(255,255,255,.45), transparent 60%),\n      var(--sand);\n    width: 100%; height: 100%;\n    display: flex; align-items: center; justify-content: center;\n    position: relative;\n  }\n  .signage::after {\n    content:\"\"; position: absolute; inset: 0;\n    background:\n      linear-gradient(180deg, transparent 50%, rgba(42,31,21,.06) 100%),\n      repeating-linear-gradient(180deg, rgba(42,31,21,.04) 0, rgba(42,31,21,.04) 1px, transparent 1px, transparent 18px);\n    pointer-events: none;\n  }\n  .signage .panel {\n    width: 60%; aspect-ratio: 4 / 5;\n    background: var(--ivory);\n    box-shadow: 0 50px 60px -30px rgba(20,17,13,.45);\n    display:flex; align-items:center; justify-content:center;\n    border: 1px solid rgba(42,31,21,.1);\n    position: relative; z-index: 1;\n  }\n  .signage .panel .logo-wrap { width: 70%; }\n\n  .menu {\n    background: var(--ivory);\n    width: 100%; height: 100%;\n    padding: 40px 48px;\n    display: flex; flex-direction: column; gap: 18px;\n    position: relative;\n  }\n  .menu-head { display:flex; align-items:center; justify-content:space-between; }\n  .menu-head .logo-wrap { width: 70px; }\n  .menu-head .meta {\n    text-align: right;\n    font-family: 'Jost', sans-serif; font-weight: 300; font-size: 9px;\n    letter-spacing: .4em; text-transform: uppercase; color: var(--cocoa); text-indent: .4em;\n  }\n  .menu .title {\n    font-family: 'Cormorant Garamond', serif; font-style: italic;\n    font-size: 36px; color: var(--espresso);\n    border-top: 1px solid var(--champagne);\n    border-bottom: 1px solid var(--champagne);\n    padding: 10px 0; margin: 6px 0;\n  }\n  .menu-row {\n    display: flex; justify-content: space-between; align-items: baseline;\n    gap: 12px;\n  }\n  .menu-row .dish {\n    font-family: 'Marcellus', serif; font-size: 14px; letter-spacing: .03em; color: var(--ink);\n  }\n  .menu-row .desc {\n    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 12px; color: var(--cocoa);\n  }\n  .menu-row .dot { flex: 1; border-bottom: 1px dotted var(--cocoa); margin: 0 8px; opacity:.4; height: 1px; align-self: end; }\n  .menu-row .price {\n    font-family: 'Marcellus', serif; font-size: 13px; color: var(--gold-deep);\n  }\n\n  /* ---------- Logo SVG re-tinting ---------- */\n  /* The source logo is solid black on transparent; we tint via CSS filter or color via fill-replacement on inline SVG */\n  .logo-svg path { fill: currentColor; }\n  /* Force SVG fill to inherit color via currentColor — robust across symbol/use */\n  svg { fill: currentColor; }\n\n  /* ---------- Patterns ---------- */\n  .pattern-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }\n  .pattern {\n    aspect-ratio: 4 / 3;\n    border: 1px solid rgba(42,31,21,.08);\n    position: relative;\n    overflow: hidden;\n  }\n  .pattern .lbl {\n    position:absolute; bottom:14px; left:18px;\n    font-family:'Jost',sans-serif; font-weight:300; font-size:10px;\n    letter-spacing:.4em; text-transform:uppercase; text-indent:.4em;\n  }\n  .pattern.p1 {\n    background:\n      radial-gradient(circle at 25% 30%, rgba(202,161,90,.35) 0 2px, transparent 3px),\n      radial-gradient(circle at 75% 70%, rgba(202,161,90,.35) 0 2px, transparent 3px),\n      var(--bone);\n    background-size: 56px 56px;\n  }\n  .pattern.p2 {\n    background:\n      linear-gradient(45deg, var(--champagne) 25%, transparent 25%, transparent 75%, var(--champagne) 75%) 0 0/22px 22px,\n      var(--ivory);\n    opacity: 1;\n  }\n  .pattern.p2 { background: repeating-linear-gradient(45deg, transparent 0 18px, rgba(154,123,61,.18) 18px 19px), var(--ivory); }\n  .pattern.p3 {\n    background:\n      radial-gradient(60% 80% at 50% 50%, rgba(154,123,61,.18), transparent 70%),\n      var(--espresso);\n    color: var(--champagne);\n  }\n  .pattern.p3 .lbl { color: var(--champagne); }\n\n  /* ---------- Footer ---------- */\n  footer {\n    margin-top: 80px;\n    padding-top: 28px;\n    border-top: 1px solid rgba(42,31,21,.18);\n    display: flex; justify-content: space-between; align-items: baseline;\n  }\n  footer .signoff {\n    font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400;\n    font-size: 38px; color: var(--gold-deep); line-height: 1; letter-spacing: -.005em;\n  }\n  footer .info {\n    font-family: 'Jost', sans-serif; font-weight: 300; font-size: 10px;\n    letter-spacing: .45em; text-transform: uppercase; color: var(--cocoa); text-indent: .45em;\n  }\n\n  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }\n\n  .ratios {\n    display: flex; align-items: end; gap: 18px;\n  }\n  .ratio {\n    flex: 1; background: var(--bone); padding: 14px;\n    bor ">Logo system<\u002Fh2>\n    <p class=\"lede\" style=\"margin-top: 14px; margin-bottom: 36px;\">\n      Reproduzir sempre num só tom. Quatro pares cor-fundo aprovados — preferir <em>dourado suave sobre preto<\u002Fem> em peças impressas premium.\n    <\u002Fp>\n\n    <div class=\"logo-grid\">\n      <div class=\"logo-cell cell-ivory\">\n        <span class=\"lbl\">Tinta · creme<\u002Fspan>\n        <div class=\"logo-wrap\" style=\"color: var(--ink);\">\n          <svg viewBox=\"169.297 122.429 898.77 627.386\" style=\"width:100%;height:auto;color:inherit\"><use href=\"#ma-logo\"><\u002Fuse><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"logo-cell cell-bone\">\n        <span class=\"lbl\">Preto · papel<\u002Fspan>\n        <div class=\"logo-wrap\" style=\"color: var(--espresso);\">\n          <svg viewBox=\"169.297 122.429 898.77 627.386\" style=\"width:100%;height:auto;color:inherit\"><use href=\"#ma-logo\"><\u002Fuse><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"logo-cell cell-gold\">\n        <span class=\"lbl\">Preto · dourado<\u002Fspan>\n        <div class=\"logo-wrap\" style=\"color: var(--espresso);\">\n          <svg viewBox=\"169.297 122.429 898.77 627.386\" style=\"width:100%;height:auto;color:inherit\"><use href=\"#ma-logo\"><\u002Fuse><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"logo-cell cell-ink\">\n        <span class=\"lbl\">Dourado · preto<\u002Fspan>\n        <div class=\"logo-wrap\" style=\"color: var(--champagne);\">\n          <svg viewBox=\"169.297 122.429 898.77 627.386\" style=\"width:100%;height:auto;color:inherit\"><use href=\"#ma-logo\"><\u002Fuse><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"logo-cell cell-cacau\">\n        <span class=\"lbl\">Creme · cacau<\u002Fspan>\n        <div class=\"logo-wrap\" style=\"color: var(--ivory);\">\n          <svg viewBox=\"169.297 122.429 898.77 627.386\" style=\"width:100%;height:auto;color:inherit\"
