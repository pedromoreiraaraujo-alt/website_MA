<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pack — Moreira &amp; Araújo Eventos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cream: #f5efe2; --cream-light: #faf7f2; --cream-mid: #ede4d0;
      --cream-border: #e0d5c0; --dark: #14120f; --dark-soft: #2a2520;
      --muted: #6b5f4a; --gold: #b89a55; --gold-light: #d4b87a;
      --gold-dark: #8a7340; --white: #ffffff;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Lato', sans-serif; background: var(--cream); color: var(--dark); font-size: 15px; line-height: 1.7; overflow-x: hidden; }
    img { max-width: 100%; display: block; }
    a { text-decoration: none; color: inherit; }

    /* NAV */
    nav { position: sticky; top: 0; z-index: 200; background: var(--cream-light); border-bottom: 1px solid var(--cream-border); padding: 1.5rem 2rem; }
    .nav-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.4rem; font-style: italic; color: var(--dark); }
    .nav-logo img { height: 56px; width: auto; }
    .nav-logo .amp { font-family: Georgia, serif; font-style: italic; color: var(--gold); }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--dark); }
    .nav-cta { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; border: 1px solid var(--gold); color: var(--gold); padding: 0.5rem 1.25rem; transition: background 0.2s, color 0.2s; }
    .nav-cta:hover { background: var(--gold); color: var(--white); }
    .hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 4px; }
    .hamburger span { display: block; width: 22px; height: 1.5px; background: var(--dark); }
    .mobile-nav { display: none; position: fixed; inset: 0; z-index: 300; background: var(--cream-light); flex-direction: column; align-items: center; justify-content: center; gap: 2.5rem; }
    .mobile-nav.open { display: flex; }
    .mobile-nav a { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 2rem; font-style: italic; color: var(--dark); }
    .mobile-nav-close { position: absolute; top: 1.5rem; right: 2rem; background: none; border: none; font-size: 1.25rem; cursor: pointer; color: var(--muted); }

    /* PACK INTRO — two-column */
    .pack-intro {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: start;
      border-bottom: 1px solid var(--cream-border);
    }
    .pack-intro-img {
      background: var(--dark);
      overflow: hidden; position: sticky;
      top: 0;
      height: 100vh;
    }
    .pack-intro-img img {
      width: 100%; height: 100%;
      object-fit: cover;
      position: absolute; inset: 0;
    }
    .pack-intro-back {
      position: absolute; top: 1.5rem; left: 1.5rem; z-index: 2;
      display: inline-flex; align-items: center; gap: 0.5rem;
      font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); transition: color 0.2s;
      background: rgba(245,239,226,0.85); padding: 0.4rem 0.85rem;
    }
    .pack-intro-back:hover { color: var(--dark); }
    .pack-intro-info {
      background: #d9cdb8; color: var(--dark);
      display: flex; flex-direction: column; justify-content: center;
      padding: 4rem 3.5rem;
      gap: 0;
    }
    .pack-intro-badge {
      display: inline-block; background: var(--gold); color: var(--dark);
      font-size: 9px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
      padding: 0.3rem 0.75rem; align-self: flex-start; margin-bottom: 1.5rem;
    }
    .pack-intro-event {
      font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.75rem;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .pack-intro-event::before { content: ''; display: block; width: 20px; height: 1px; background: var(--gold); }
    .pack-intro-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2.8rem, 4vw, 4rem); font-weight: 300;
      color: var(--dark); line-height: 1.05; letter-spacing: -0.02em;
      margin-bottom: 1.75rem;
    }
    .pack-intro-desc {
      font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic;
      font-size: 1.1rem; color: var(--muted); line-height: 1.8;
      margin-bottom: 2rem; border-top: 1px solid rgba(20,18,15,0.12); padding-top: 1.75rem;
    }
    .pack-intro-stats {
      display: flex; gap: 2.5rem; flex-wrap: wrap; align-items: center;
      margin-bottom: 2.5rem;
    }
    .pack-summary-stat-label {
      font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.3rem;
    }
    .pack-summary-stat-value {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.1rem; color: var(--dark);
    }
    .pack-summary-divider { width: 1px; height: 2rem; background: rgba(20,18,15,0.15); flex-shrink: 0; }
    .pack-summary-cta {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--gold); color: var(--dark);
      padding: 0.85rem 1.75rem; align-self: flex-start;
      font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      border: none; cursor: pointer; white-space: nowrap;
      transition: background 0.2s;
    }
    .pack-summary-cta:hover { background: var(--gold-light); }

    /* ITEMS inside dark panel */
    .pack-items-panel {
      border-top: 1px solid rgba(20,18,15,0.12);
      padding-top: 2rem;
      margin-top: 2rem;
    }
    .pack-items-header {
      font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--gold-dark); margin-bottom: 2rem;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .pack-items-header::after { content: ''; flex: 1; height: 1px; background: rgba(20,18,15,0.12); }

    .pack-category-group { margin-bottom: 2rem; }
    .pack-category-label {
      font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 1rem;
    }

    .pack-detail-items {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
    }
    .pack-detail-item {
      display: flex; flex-direction: column;
      background: var(--white);
      overflow: hidden; position: relative;
      box-shadow: 0 2px 8px rgba(20,18,15,0.06), 0 1px 2px rgba(20,18,15,0.04);
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
    }
    @media (hover: hover) and (pointer: fine) {
      .pack-detail-item:hover {
        transform: translateY(-5px);
        box-shadow: 0 12px 32px rgba(184,154,85,0.18), 0 4px 12px rgba(20,18,15,0.1);
      }
      .pack-detail-item:hover .pack-detail-thumb::after { opacity: 1; }
      .pack-detail-item:hover .pack-detail-thumb img { transform: scale(1.05); }
    }
    .pack-detail-thumb {
      width: 100%; aspect-ratio: 1; overflow: hidden;
      background: var(--cream-light); flex-shrink: 0; position: relative;
    }
    .pack-detail-thumb::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(184,154,85,0.15) 0%, transparent 60%);
      opacity: 0; transition: opacity 0.25s ease; pointer-events: none;
    }
    .pack-detail-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .pack-detail-item-body {
      padding: 0.8rem 0.85rem 0.75rem;
      flex: 1; display: flex; flex-direction: column; gap: 0.3rem;
    }
    .pack-detail-item-name {
      font-size: 0.8rem; font-weight: 700; color: var(--dark); line-height: 1.35;
    }
    .pack-detail-qty {
      font-size: 0.7rem; font-weight: 700; color: var(--gold);
      letter-spacing: 0.5px; text-transform: uppercase;
    }

    /* RELATED PACKS */
    .related-packs { background: var(--cream-mid); padding: 4rem 2rem; }
    .related-inner { max-width: 1200px; margin: 0 auto; }
    .related-label {
      font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--gold); margin-bottom: 2rem;
      display: flex; align-items: center; gap: 0.75rem;
    }
    .related-label::after { content: ''; flex: 1; height: 1px; background: var(--cream-border); }
    .related-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    .related-card {
      position: relative; overflow: hidden; aspect-ratio: 4/3; cursor: pointer;
      background: var(--dark);
    }
    .related-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: opacity 0.3s, transform 6s ease; }
    .related-card:hover img { opacity: 0.5; transform: scale(1.04); }
    .related-card-body {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: flex-end; padding: 1.25rem;
    }
    .related-card-event {
      font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(245,239,226,0.6); margin-bottom: 0.3rem;
    }
    .related-card-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.5rem; color: var(--cream-light); line-height: 1.1;
    }
    .related-card-badge {
      display: inline-block; background: var(--gold); color: var(--dark);
      font-size: 8px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      padding: 0.2rem 0.5rem; margin-bottom: 0.5rem; align-self: flex-start;
    }

    /* QUANTITY SELECTOR */
    .pack-cta-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .qty-selector { display: flex; align-items: center; gap: 0.4rem; height: 44px; }
    .qty-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid rgba(20,18,15,0.25);
      background: transparent; color: var(--dark);
      font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s, background 0.2s, color 0.2s, transform 0.15s;
    }
    .qty-btn:hover { border-color: var(--gold); background: var(--gold); color: var(--dark); transform: scale(1.08); }
    .qty-btn:active { transform: scale(0.95); }
    .qty-value {
      width: 44px; text-align: center;
      font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 500;
      border: none; background: transparent; color: var(--dark);
      height: 44px; padding: 0;
    }
    .qty-value::-webkit-inner-spin-button,
    .qty-value::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .qty-value[type=number] { -moz-appearance: textfield; }

    /* ADD TO CART */
    .btn-add-cart {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--dark); color: var(--cream-light);
      padding: 0.85rem 1.75rem;
      font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      border: none; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .btn-add-cart:hover { background: var(--dark-soft); }
    .btn-add-cart.btn-added { background: var(--gold); color: var(--dark); }

    /* CART FAB */
    .cart-fab {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 400;
      width: 56px; height: 56px;
      background: var(--dark); border: 1px solid rgba(184,154,85,0.3);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.25s, transform 0.2s, border-color 0.2s;
    }
    .cart-fab:hover { background: var(--dark-soft); border-color: var(--gold); transform: scale(1.06); }
    .cart-fab:active { transform: scale(0.97); }
    .cart-fab svg { width: 22px; height: 22px; stroke: var(--cream-light); fill: none; stroke-width: 1.5; stroke-linecap: round; }
    .cart-badge {
      position: absolute; top: -5px; right: -5px;
      min-width: 20px; height: 20px; padding: 0 5px;
      background: var(--gold); color: var(--dark);
      font-size: 10px; font-weight: 700; border-radius: 10px;
      display: none; align-items: center; justify-content: center;
    }

    /* TOAST */
    .toast {
      position: fixed; bottom: 6rem; right: 2rem; z-index: 500;
      background: var(--dark); color: var(--cream-light);
      padding: 0.75rem 1.25rem; font-size: 0.82rem; font-weight: 500;
      transform: translateY(8px); opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* FOOTER */
    footer { background: var(--dark); color: rgba(245,239,226,0.45); padding: 2rem; border-top: 1px solid rgba(184,154,85,0.15); }
    .footer-bottom-simple { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: rgba(245,239,226,0.28); }
    .footer-bottom-simple a { color: rgba(245,239,226,0.28); }

    /* Responsive */
    @media (max-width: 960px) {
      .nav-links, .nav-cta { display: none; }
      .hamburger { display: flex; }
      .nav-logo img { height: 44px; }
      .pack-intro { grid-template-columns: 1fr; }
      .pack-intro-img { position: relative; height: 55vw; min-height: 260px; }
      .pack-intro-info { padding: 2.5rem 2rem; }
      .pack-summary-cta { align-self: stretch; justify-content: center; }
      .related-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      .pack-intro-img { height: 65vw; }
      .pack-intro-info { padding: 2rem 1.25rem; }
      .pack-intro-title { font-size: 2.5rem; }
      .pack-intro-stats { flex-direction: column; gap: 0.75rem; align-items: flex-start; }
      .pack-summary-divider { display: none; }
      .pack-summary-stat { display: flex; flex-direction: row; align-items: baseline; gap: 0.75rem; }
      .related-grid { grid-template-columns: 1fr; }
      .pack-items-section { padding: 2rem 1.25rem 4rem; }
      .footer-bottom-simple { flex-direction: column; gap: 0.5rem; text-align: center; }
    }
  </style>

</head>

    /* ── RENDER ── */
    function getPackId() {
      return new URLSearchParams(window.location.search).get('id') || 'casamento';
    }

    function render() {
      const id   = getPackId();
      const pack = PACKS[id];
      if (!pack) { window.location = 'catalogo.html'; return; }

      document.title = pack.title + ' — Moreira & Araújo';

      /* Intro */
      const bg = document.getElementById('heroBg');
      bg.src = pack.image;
      bg.alt = pack.title;
      document.getElementById('heroEvent').textContent = pack.event;
      document.getElementById('heroTitle').textContent = pack.title;

      /* Summary strip stats */
      document.getElementById('summaryCta').addEventListener('click', () => {
        window.location = 'contacto.html';
      });
      const statsEl = document.getElementById('summaryStats');
      statsEl.innerHTML = pack.stats.map((s, i) => `
        ${i > 0 ? '<div class="pack-summary-divider"></div>' : ''}
        <div class="pack-summary-stat">
          <div class="pack-summary-stat-label">${s.label}</div>
          <div class="pack-summary-stat-value">${s.value}</div>
        </div>
      `).join('');

      /* Description */
      document.getElementById('packDesc').textContent = pack.desc;

      /* Items grid */
      const wrap = document.getElementById('packItemsWrap');
      wrap.innerHTML = pack.categories.map(cat => `
        <div class="pack-category-group">
          <div class="pack-category-label">${cat.label}</div>
          <div class="pack-detail-items">
            ${cat.items.map(item => `
              <div class="pack-detail-item">
                <div class="pack-detail-thumb">
                  <img src="${item.thumb}" alt="${item.name}" loading="lazy">
                </div>
                <div class="pack-detail-item-body">
                  <div class="pack-detail-item-name">${item.name}</div>
                  <div class="pack-detail-qty">${item.qty}</div>
                </div>
              </div>`).join('')}
          </div>
        </div>
      `).join('');

      /* Related */
      const related = Object.values(PACKS).filter(p => p.id !== id).slice(0, 3);
      document.getElementById('relatedGrid').innerHTML = related.map(p => `
        <a href="pack.html?id=${p.id}" class="related-card">
          <img src="${p.image}" alt="${p.title}" loading="lazy">
          <div class="related-card-body">
            <span class="related-card-badge">Pack</span>
            <div class="related-card-event">${p.event}</div>
            <div class="related-card-title">${p.title}</div>
          </div>
        </a>
      `).join('');
    }

    /* ── CART ── */
    function getCart() { return JSON.parse(localStorage.getItem('ma_cart') || '[]'); }
    function saveCart(c) { localStorage.setItem('ma_cart', JSON.stringify(c)); }

    function updateCartBadge() {
      const total = getCart().reduce((sum, i) => sum + i.qty, 0);
      const badge = document.getElementById('cartBadge');
      badge.textContent = total;
      badge.style.display = total > 0 ? 'flex' : 'none';
    }

    function changeQty(delta) {
      const el = document.getElementById('packQtyVal');
      el.value = Math.max(1, (parseInt(el.value) || 1) + delta);
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    render();
    updateCartBadge();

    document.getElementById('addCartBtn').addEventListener('click', function() {
      const id = new URLSearchParams(location.search).get('id') || 'lyon';
      const pack = PACKS[id];
      if (!pack) return;
      const qty = Math.max(1, parseInt(document.getElementById('packQtyVal').value) || 1);
      const cart = getCart();
      const existing = cart.find(item => item.id === 'pack-' + id);
      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({ id: 'pack-' + id, ref: 'Pack ' + pack.title, name: 'Pack ' + pack.title, image: pack.image, qty: qty });
      }
      saveCart(cart);
      updateCartBadge();
      showToast('+ ' + qty + '× Pack ' + pack.title + (qty > 1 ? ' adicionados' : ' adicionado'));
      const btn = this;
      const origHtml = btn.innerHTML;
      btn.innerHTML = '✓ Adicionado';
      btn.classList.add('btn-added');
      setTimeout(() => { btn.innerHTML = origHtml; btn.classList.remove('btn-added'); }, 1200);
    });

    /* Mobile nav */
    (function() {
      const hamburger  = document.getElementById('hamburger');
      const mobileNav  = document.getElementById('mobileNav');
      const mobileClose = document.getElementById('mobileClose');
      hamburger.addEventListener('click',  () => mobileNav.classList.add('open'));
      mobileClose.addEventListener('click', () => mobileNav.classList.remove('open'));
      mobileNav.querySelectorAll('a').forEach(l => l.addEventListener('click', () => mobileNav.classList.remove('open')));
    })();
  </script>
